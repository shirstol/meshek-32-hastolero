# Render exposes the host, database, user and password separately. This keeps
# the PostgreSQL credentials in hosting environment variables, not in source.
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT:5432}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
# The first hosted launch starts with an empty PostgreSQL database. Hibernate
# creates/updates the schema, while SeedData supplies the initial catalog.
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
app.cors.allowed-origin=${FRONTEND_ORIGIN}
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
