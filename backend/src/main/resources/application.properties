spring.application.name=meshek32-backend
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/meshek32;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://127.0.0.1:5173}
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
